<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><title>Use an activity discrepancy to choose an informative next experiment</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#5c8b9b" stroke-width="1.5"/></marker></defs><rect width="1040" height="400" fill="white"/><g font-family="Arial, sans-serif"><rect x="215" y="15" width="610" height="64" rx="14" fill="#1a5368" stroke="#1a5368"/><text x="520" y="42" fill="white" font-size="21" font-weight="600" text-anchor="middle">Biochemical activity retained</text><text x="520" y="66" fill="white" font-size="19" font-weight="500" text-anchor="middle">but the cellular response is weak</text><path d="M520 80 V110 H190 V137" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 80 V137" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 80 V110 H850 V137" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="145" width="300" height="65" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="190" y="184" fill="#244658" font-size="21" font-weight="600" text-anchor="middle">Limited cell exposure?</text><path d="M190 211 V239" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="246" width="300" height="83" rx="14" fill="#fff" stroke="#c6dae3"/><text x="190" y="279" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">Measure permeability</text><text x="190" y="306" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">or efflux.</text><rect x="370" y="145" width="300" height="65" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="520" y="184" fill="#244658" font-size="21" font-weight="600" text-anchor="middle">Different biology?</text><path d="M520 211 V239" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="246" width="300" height="83" rx="14" fill="#fff" stroke="#c6dae3"/><text x="520" y="279" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">Test engagement and</text><text x="520" y="306" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">model context.</text><rect x="700" y="145" width="300" height="65" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="850" y="184" fill="#244658" font-size="21" font-weight="600" text-anchor="middle">Assay artifact?</text><path d="M850 211 V239" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="700" y="246" width="300" height="83" rx="14" fill="#fff" stroke="#c6dae3"/><text x="850" y="279" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">Check material and use</text><text x="850" y="306" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">an orthogonal readout.</text><text x="520" y="378" fill="#244658" font-size="21" font-weight="600" text-anchor="middle">Choose the experiment that can distinguish the explanations.</text></g></svg>