<text x="24" y="71" class="heading" style="font-size:25px">growth opportunities</text>
<text x="24" y="104" class="small">Useful features align with the proposed edits.</text>
<text x="195" y="143" class="small" style="fill:#6d8591">Solvent</text>
<path class="protein" d="M20 168 C36 151 49 177 65 165 C77 155 89 154 94 170 C98 184 119 184 117 201 C115 215 94 215 98 228 Q99 234 103 237 C111 247 123 251 119 266 C115 279 100 280 108 295 C114 307 137 304 140 320 C142 334 128 341 142 354 C151 363 171 356 177 372 C182 387 174 397 191 400 C205 403 214 398 230 409 C243 419 256 410 262 400 C270 386 290 397 300 381 C307 368 292 357 309 347 C328 337 342 344 342 325 C341 311 329 304 342 292 C358 279 343 266 347 252 Q350 244 357 237 C366 225 349 216 355 202 C361 190 378 194 378 178 C378 166 389 157 402 167 C414 177 426 156 436 168 V449 H20Z"/>
<text x="38" y="429" class="small">Protein</text>
<use href="#hit" x="230" y="284"/>
<path class="growth" d="M195 264 L151 243"/>
<path class="growth" d="M265 264 L309 243"/>
<path class="growth" d="M230 324 V350"/>
<circle class="group" cx="138" cy="237" r="16"/>
<circle class="group" cx="322" cy="237" r="16"/>
<circle class="group" cx="230" cy="373" r="16"/>
<path class="contact" d="M122 237 H104 M338 237 H357 M230 389 V407"/>
<circle class="site" cx="103" cy="237" r="6"/>
<circle class="site" cx="357" cy="237" r="6"/>
<circle class="site" cx="230" cy="409" r="6"/>
<text x="230" y="194" text-anchor="middle" class="label">Several growth directions</text>
<text x="230" y="486" text-anchor="middle" class="body">Extensions can reach distinct</text>
<text x="230" y="518" text-anchor="middle" class="body">features of the pocket.</text>
</g>
<g transform="translate(492 12)">
<rect width="456" height="550" rx="16" fill="#fbfdfd" stroke="#c6dae3"/>
<text x="24" y="39" class="heading" style="font-size:25px">Few productive</text>
<text x="24" y="71" class="heading" style="font-size:25px">growth opportunities</text>
<text x="24" y="104" class="small">For the proposed edits in this binding pose.</text>
<g transform="translate(0 30)">
<path class="protein" d="M20 168 C34 152 49 179 63 167 C78 154 91 175 106 164 C121 151 135 177 149 165 C161 155 174 161 174 176 C173 188 189 190 185 203 C181 215 173 218 187 229 C198 237 208 231 215 241 Q221 249 230 246 C241 241 247 252 258 242 C267 232 281 241 283 227 C286 213 271 206 284 194 C296 183 280 171 297 164 C311 157 319 179 335 166 C348 155 361 175 377 164 C391 153 402 176 417 166 Q428 159 436 168 V419 H20Z"/>
<use href="#hit" x="230" y="193"/>
<path class="growth" d="M195 173 L155 142"/>
<path class="growth" d="M265 173 L305 142"/>
<path class="growth" d="M230 153 V128"/>
<circle class="group" cx="139" cy="130" r="16"/>
<circle class="group" cx="321" cy="130" r="16"/>
<circle class="group" cx="230" cy="109" r="16"/>
<path class="contact" d="M230 233 V244"/>
<circle class="site" cx="230" cy="246" r="6"/>
