<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400"><title>Measure different aspects of a compound rather than equating one assay with the whole profile</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#5c8b9b" stroke-width="1.5"/></marker></defs><rect width="1040" height="400" fill="white"/><g font-family="Arial, sans-serif"><rect x="390" y="15" width="260" height="58" rx="14" fill="#1a5368" stroke="#1a5368"/><text x="520" y="51" fill="white" font-size="22" font-weight="600" text-anchor="middle">The same analog</text><path d="M520 74 V106 H190 V128" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 74 V128" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 74 V106 H850 V128" fill="none" stroke="#5c8b9b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="136" width="300" height="156" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="190" y="175" fill="#244658" font-size="23" font-weight="600" text-anchor="middle">Primary activity</text><text x="190" y="220" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">Does it affect the</text><text x="190" y="248" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">intended assay readout?</text><rect x="370" y="136" width="300" height="156" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="520" y="175" fill="#244658" font-size="23" font-weight="600" text-anchor="middle">Cellular function</text><text x="520" y="220" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">Does it produce the</text><text x="520" y="248" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">relevant cellular response?</text><rect x="700" y="136" width="300" height="156" rx="14" fill="#f3f8fa" stroke="#c6dae3"/><text x="850" y="175" fill="#244658" font-size="23" font-weight="600" text-anchor="middle">Selectivity</text><text x="850" y="220" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">What else does it</text><text x="850" y="248" fill="#244658" font-size="18" font-weight="500" text-anchor="middle">affect under these conditions?</text><rect x="40" y="320" width="960" height="60" rx="14" fill="#fff6df" stroke="#e9d5a4"/><text x="520" y="347" fill="#244658" font-size="19" font-weight="500" text-anchor="middle">Check material quality and assay behavior across the comparisons.</text><text x="520" y="370" fill="#244658" font-size="17" font-weight="500" text-anchor="middle">A potency value alone does not explain the mechanism.</text></g></svg>