<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Productive growth opportunities depend on the hit and its binding pose</title>
<desc id="desc">Illustrative binding poses. On the left, an irregular enclosed pocket offers three proposed growth directions toward protein features. On the right, a shallow indentation places most proposed extensions in solvent, without additional protein contacts. The headings describe opportunities in these poses, not a universal rule about pocket depth or whether a series can progress.</desc>
<defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#244658}.heading{font-size:28px;font-weight:700}.body{font-size:21px}.small{font-size:18px}.label{font-size:20px;font-weight:700}.protein{fill:#dce6ee;stroke:#91aab9;stroke-width:2.5}.growth{stroke:#338978;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#growthArrow)}.group{fill:#c5e6da;stroke:#338978;stroke-width:2.5}.contact{stroke:#b78328;stroke-width:3;stroke-dasharray:5 5}.site{fill:#e7bb66;stroke:#a97b2e;stroke-width:2}
</style>
<marker id="growthArrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#338978"/></marker>
<g id="hit"><path d="M-35-20 L0-40 L35-20 L35 20 L0 40 L-35 20Z" fill="#285d76" stroke="#173e52" stroke-width="3"/><text x="0" y="7" text-anchor="middle" style="fill:white;font-size:21px;font-weight:700">HIT</text></g>
</defs>
<rect width="960" height="640" fill="white"/>
<g transform="translate(12 12)">
