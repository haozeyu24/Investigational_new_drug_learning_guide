<rect x="73" y="324" width="310" height="72" rx="8" fill="#eef3f6"/>
<text x="228" y="354" text-anchor="middle" class="label">Added groups face solvent</text>
<text x="228" y="380" text-anchor="middle" class="small">No new contact in these directions</text>
<text x="230" y="486" text-anchor="middle" class="body">Most extensions shown add size</text>
<text x="230" y="518" text-anchor="middle" class="body">without new protein interactions.</text>
</g>
<g transform="translate(96 590)">
<path d="M0 0 H34" class="growth"/><text x="51" y="7" class="small">Proposed extension</text>
<path d="M279 0 H320" class="contact"/><text x="334" y="7" class="small">Possible contact</text>
<circle class="group" cx="597" cy="0" r="11"/><text x="620" y="7" class="small">Added group</text>
</g>
<text x="480" y="630" text-anchor="middle" class="small">Pocket features can enable—or constrain—further chemical optimization.</text>
</svg>
