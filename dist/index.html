function pkpdModel(f=.6,halfLife=4){
 const ke=Math.log(2)/halfLife,ka=1.2,dt=.05,points=[];
 for(let i=0;i<=480;i++){const time=i*dt,c=f*5*ka/(ka-ke)*(Math.exp(-ke*time)-Math.exp(-ka*time));points.push([time,Math.max(0,c)]);}
 const peak=points.reduce((a,b)=>b[1]>a[1]?b:a),auc=points.slice(1).reduce((sum,p,i)=>sum+(p[1]+points[i][1])*dt/2,0);
 return {points,cmax:peak[1],tmax:peak[0],auc,halfLife};
}
function pkpdResponse(points,scenario){
 let ce=0;
 return points.map(([time,c],i)=>{
  if(scenario.ke0&&i){const dt=time-points[i-1][0],mid=(c+points[i-1][1])/2;ce=mid+(ce-mid)*Math.exp(-scenario.ke0*dt);}else if(!scenario.ke0)ce=c;
  return [time,100*ce/(scenario.ec50+ce)];
 });
}
function pkpdChart(points,{label,yLabel,max=3,color='#235f85',baseline=null,shade=false,peak=false}){
 const x=t=>58+t/24*482,y=c=>230-Math.min(c,max)/max*186;
 const path=pts=>pts.map(([t,c],i)=>(i?'L':'M')+x(t).toFixed(2)+','+y(c).toFixed(2)).join(' ');
 const ticks=[0,.25,.5,.75,1].map(f=>'<line x1="58" y1="'+y(max*f)+'" x2="540" y2="'+y(max*f)+'" stroke="#e0e8ee"/><text x="48" y="'+(y(max*f)+4)+'" text-anchor="end">'+(max*f).toFixed(max===100?0:2)+'</text>').join('');
 const xticks=[0,6,12,18,24].map(t=>'<text x="'+x(t)+'" y="250" text-anchor="middle">'+t+'</text>').join('');
 const best=points.reduce((a,b)=>b[1]>a[1]?b:a);
 const marker=peak?'<circle cx="'+x(best[0])+'" cy="'+y(best[1])+'" r="4" fill="'+color+'"/><text x="'+(x(best[0])+9)+'" y="'+(y(best[1])-10)+'" fill="'+color+'">Cmax</text>':'';
 return '<svg class="pkpd-chart" viewBox="0 0 570 280" role="img" aria-label="'+escapeHtml(label)+'"><title>'+escapeHtml(label)+'</title><rect width="570" height="280" fill="white"/><g font-family="system-ui,sans-serif" font-size="12" fill="#526579"><text x="58" y="20">'+escapeHtml(yLabel)+'</text>'+ticks+xticks+'<text x="299" y="276" text-anchor="middle">Time after a single dose (hours)</text></g>'+(shade?'<path d="'+path(points)+' L540,230 L58,230 Z" fill="'+color+'" opacity=".12"/>':'')+(baseline?'<path d="'+path(baseline)+'" fill="none" stroke="#82929b" stroke-width="2" stroke-dasharray="5 5"/>':'')+'<path d="'+path(points)+'" fill="none" stroke="'+color+'" stroke-width="3"/>'+marker+'</svg>';
}
function pkpdViewContent(t){
 const view=t.views.some(v=>v.id===state.pkpdView)?state.pkpdView:'pk';
 const pd=view==='pd',options=pd?t.pdScenarios:t.pkScenarios,selected=options.find(x=>x.id===(pd?state.pkpdResponse:state.pkpdExposure))||options[0];
 const switches='<div class="pkpd-scenarios" role="group" aria-label="'+(pd?'Compare response scenarios':'Compare exposure scenarios')+'">'+options.map(x=>'<button type="button" data-pkpd-scenario="'+x.id+'" aria-pressed="'+(selected.id===x.id)+'">'+escapeHtml(x.label)+'</button>').join('')+'</div>';
 const reference=pkpdModel(),model=pd?reference:pkpdModel(selected.f,selected.halfLife);
 let charts,metrics,footnote;
 if(pd){
  const response=pkpdResponse(model.points,selected),rapid=pkpdResponse(model.points,t.pdScenarios[0]);
  charts='<div class="pkpd-chart-pair"><figure><figcaption>Same PK in every scenario</figcaption>'+pkpdChart(model.points,{label:'Simulated unbound plasma concentration, unchanged between response scenarios',yLabel:'Unbound concentration (arbitrary units)'})+'</figure><figure><figcaption>Tumor pathway inhibition</figcaption>'+pkpdChart(response,{label:'Simulated '+selected.label+' over time',yLabel:'Modeled pathway inhibition (%)',max:100,color:'#b16824',baseline:selected.id==='immediate'?null:rapid})+'</figure></div>';
  metrics='<ol class="pkpd-readouts">'+t.readouts.map(([title,text])=>'<li><strong>'+escapeHtml(title)+'</strong><span>'+escapeHtml(text)+'</span></li>').join('')+'</ol>';
  footnote='Pathway inhibition is not tumor shrinkage. Follow tumor growth separately, and assess normal-tissue effects at the same exposures. These curves do not model tumor size or toxicity.';
 }else{
  charts='<figure class="pkpd-exposure-chart"><figcaption>Concentration–time profile</figcaption>'+pkpdChart(model.points,{label:'Simulated '+selected.label+' concentration-time curve',yLabel:'Unbound concentration (arbitrary units)',baseline:selected.id==='reference'?null:reference.points,shade:true,peak:true})+'</figure>';
  metrics='<div class="pkpd-metrics">'+[['Cmax',model.cmax.toFixed(2)+' a.u.','Peak concentration'],['Tmax',model.tmax.toFixed(1)+' h','Time of the peak'],['AUC₀–₂₄',model.auc.toFixed(1)+' a.u.·h','Exposure over 24 hours'],['Half-life',model.halfLife+' h','Terminal elimination phase']].map(([label,value,meaning])=>'<div><span>'+label+'</span><strong>'+value+'</strong><small>'+meaning+'</small></div>').join('')+'</div>';
  footnote='Same dose and distribution volume in all scenarios. Lower bioavailability can reflect limited absorption or first-pass loss; the curve alone does not identify the cause.';
 }
 const assumptions=pd?'Response = 100 × Ce / (C50 + Ce). For teaching, rapid response assumes effective tumor concentration equals unbound plasma concentration (Ce); the delayed scenario uses dCe/dt = 0.25 × (Cplasma − Ce). C50 is 0.5 arbitrary units, or 2 for lower sensitivity. These are illustrative choices, not parameters for a real drug.':'A single oral dose in a one-compartment model with first-order absorption (ka = 1.2 h⁻¹) and elimination. Dose/volume = 5 arbitrary concentration units. Bioavailability is 60% (20% in the lower-bioavailability scenario); half-life is 4 hours (1 hour with faster clearance). AUC is integrated only from 0 to 24 hours. Concentration is treated as unbound, with no changing binding or distribution.';
 return '<h4>'+(pd?'Same plasma exposure. Different tumor response.':'An oral dose is only the start of tumor delivery.')+'</h4><p class="pkpd-simulation-label">Illustrative simulation · Project Kestrel · synthetic data</p>'+switches+charts+(selected.id!==(pd?'immediate':'reference')?'<p class="pkpd-legend">Dashed gray: '+(pd?'rapid response':'reference exposure')+'. Solid '+(pd?'amber':'blue')+': selected scenario.</p>':'')+'<p class="pkpd-insight" role="status">'+escapeHtml(selected.explanation)+'</p>'+metrics+'<p class="pkpd-small">'+footnote+'</p>'+(pd?'':'<details class="lead-reference-details"><summary>PK terms and interpretation</summary>'+exampleEvidenceTable(t.reference)+'</details>')+'<details class="lead-reference-details"><summary>Model assumptions</summary><p>'+assumptions+'</p></details>'+(pd?'<button class="button primary" data-lead-topic="optimization">Apply this to lead optimization →</button>':'<button class="button primary" data-pkpd-view="pd">Next: understand the response →</button>');

 const cards=n.comparison.rows.map((row,i)=>'<article class="vertex-ring-card'+(i===0?' is-reference':i===2||i===4?' is-retained':'')+'"><header><h4>Compound '+escapeHtml(row[0])+'</h4><span>'+outcomes[i]+'</span></header><img src="assets/vertex-indole-substitution-'+escapeHtml(row[0])+'.svg" width="420" height="245" alt="Compound '+escapeHtml(row[0])+': '+escapeHtml(row[1])+'. Added substituents relative to 16 are highlighted in amber."><p class="vertex-ring-edit-label">'+escapeHtml(row[1])+'</p><p class="vertex-ring-card-activity">EC₅₀ '+escapeHtml(row[2])+' µM</p></article>').join('');
 return '<article class="vertex-indole-simple"><div class="vertex-indole-intro"><figure><h3>Compound 16</h3><img src="assets/vertex-lead-16-regions.svg" width="560" height="340" alt="Compound 16: quinolinone core, amide linker, and indole / amine-derived region."></figure><section><h3>Can adding substituents to the indole increase potency?</h3><p>Retain the quinolinone–amide portion and the free indole NH. Explore the size and position of added alkyl groups.</p><ul><li><strong>Position:</strong> compare substitution at indole positions 3 and 5.</li><li><strong>Size:</strong> compare ethyl with the bulkier tert-butyl group.</li><li><strong>Readout:</strong> measure CFTR functional potency in the same assay.</li></ul><p class="vertex-indole-result"><strong>What happened:</strong> 27 remained equipotent with 16. Compound 29 gained about fivefold potency; 28 and 30 gained about tenfold.</p></section></div><section class="vertex-ring-gallery"><header><h3>Keep the indole. Vary size and position.</h3><p>Four substituted analogs compared with lead 16. Amber highlights the added alkyl group.</p></header><div class="vertex-ring-card-grid vertex-linker-card-grid">'+cards+'</div><p class="vertex-tree-table-note">NIH-3T3 F508del-CFTR potentiation assay. EC₅₀ values are mean ± SD from at least three determinations. Lower EC₅₀ means greater potency; fold gains are approximate comparisons with 16.</p><p class="vertex-ring-chronology">These activity gains identify promising analogs for broader profiling. This comparison does not establish improved solubility, selectivity or exposure.</p></section><p class="vertex-map-citation"><a href="https://doi.org/10.1021/jm5012808" target="_blank" rel="noopener noreferrer">Hadida et al. · Tables 2 and 5, text p. 9779 ↗</a></p></article>';
}
function vertexRingOpenTab(n){
 const rows=[['17','Indoline reference','0.4 ± 0.08',null],...n.comparison.rows];
 const cards=rows.map((row,i)=>'<article class="vertex-ring-card'+(i===0?' is-reference':row[0]==='36'?' is-retained':'')+'"><header><h4>Compound '+escapeHtml(row[0])+'</h4>'+(i===0?'<span>Starting framework</span>':row[0]==='36'?'<span>Next chemistry</span>':'')+'</header><img src="assets/vertex-ring-open-'+escapeHtml(row[0])+'.svg" width="420" height="245" alt="Compound '+escapeHtml(row[0])+': '+escapeHtml(i===0?row[1]:row[0]==='31'?'Ring-opened aniline, no alkyl substituent':row[1]+' at the 4-position')+'."><p class="vertex-ring-edit-label">'+escapeHtml(i===0?row[1]:row[0]==='31'?'Open the ring · 4-H':'4-'+row[1])+'</p><div class="vertex-ring-card-activity">EC₅₀ '+escapeHtml(row[2])+' µM'+(row[3]!==null?'<small>Calculated logP · '+escapeHtml(row[3])+'</small>':'<small>Reference before ring opening</small>')+'</div></article>').join('');
 return '<article class="vertex-indole-simple"><div class="vertex-indole-intro"><figure><h3>Compound 17</h3><img src="assets/vertex-17-regions.svg" width="560" height="340" alt="Compound 17: quinolinone core, amide linker, and indoline / amine-derived region."></figure><section><h3>Can we open the ring and recover potency through substitution?</h3><p>Indoline 17 retained activity after reducing the indole double bond. This encouraged the team to explore a ring-opened aniline framework.</p><ul><li><strong>Open:</strong> remove the two-carbon bridge in the five-membered ring to give aniline 31.</li><li><strong>Rebuild:</strong> add alkyl groups at the 4-position; compare size and branching in 32–36.</li><li><strong>Measure:</strong> compare CFTR potency and the reported calculated lipophilicity.</li></ul><p class="vertex-indole-result"><strong>What happened:</strong> opening the ring weakened activity in 31. Substitution recovered it: 36 reached an EC₅₀ of 0.1 µM, comparable to lead 16.</p></section></div><section class="vertex-ring-gallery"><header><h3>Open the ring. Find a productive substitution.</h3><p>Amber marks the exposed amine in 31 and the alkyl groups added to 31 in compounds 32–36.</p></header><div class="vertex-ring-card-grid">'+cards+'</div><p class="vertex-tree-table-note">NIH-3T3 F508del-CFTR potentiation assay. EC₅₀: mean ± SD from at least three determinations. Lower EC₅₀ means greater potency. LogP values here are calculated, not measured.</p><p class="vertex-ring-chronology">From 31 to 36, calculated logP rises from 0.4 to 2.1 as activity recovers. The paper does not report a matched solubility, permeability or PK comparison establishing an improvement in those properties.</p></section><p class="vertex-map-citation"><a href="https://doi.org/10.1021/jm5012808" target="_blank" rel="noopener noreferrer">Hadida et al. · Tables 2 and 6, text pp. 9779–9780 ↗</a></p></article>';
}
function vertexPhenolTab(n){
 const card=(num,edit,activity,badge='',ref=false,src='assets/vertex-phenol-edit-'+num+'.svg')=>'<article class="vertex-ring-card'+(ref?' is-reference':badge?' is-retained':'')+'"><header><h4>Compound '+num+'</h4>'+(badge?'<span>'+escapeHtml(badge)+'</span>':'')+'</header><img src="'+src+'" width="420" height="245" alt="Compound '+num+': '+escapeHtml(edit)+'. Amber identifies the region being varied."><p class="vertex-ring-edit-label">'+escapeHtml(edit)+'</p><p class="vertex-ring-card-activity">'+escapeHtml(activity)+'</p></article>';
 const first=n.comparison.rows.map(row=>card(row[0],row[1],row[2],row[0]==='36'?'Starting framework':row[0]==='45'?'Phenol starting point':'',row[0]==='36')).join('');
 const second=[['45','H · reference','3 ± 2'],['46','Add fluorine','2 ± 1'],['47','Add trifluoromethyl','3 ± 1'],['48','Add tert-butyl','3 ± 1']].map(row=>card(row[0],row[1],'EC₅₀ '+row[2]+' nM',row[0]==='45'?'Reference':row[0]==='48'?'Later selected as DC':'',row[0]==='45','assets/vertex-phenol-edit-'+row[0]+(row[0]==='45'?'-reference':'')+'.svg')).join('');
 return '<article class="vertex-indole-simple vertex-phenol-tab"><div class="vertex-indole-intro"><figure><h3>Compound 36</h3><img src="assets/vertex-phenol-edit-36.svg" width="420" height="245" alt="Compound 36 with its aniline NH₂ group highlighted in amber."><figcaption class="vertex-phenol-caption">Explore replacements for the highlighted NH₂ group.</figcaption></figure><section><h3>Can replacing the aniline group further improve potency?</h3><p>Compound 36 recovered useful activity. The next question was whether its aniline NH₂ group was necessary—or whether another group could work better.</p><ul><li><strong>Remove or replace:</strong> compare H, hydrogen-bond donors and other aniline replacements.</li><li><strong>Preserve:</strong> keep the quinolinone–amide portion and the tert-butyl substituent.</li><li><strong>Measure:</strong> compare CFTR functional activity in compounds 37–45.</li></ul><p class="vertex-indole-result"><strong>What happened:</strong> removing NH₂ retained activity in 43. Replacing it with OH produced phenol 45, with a much lower EC₅₀.</p></section></div><section class="vertex-ring-gallery"><header><h3>1 · Replace the aniline group: 36 → 37–45</h3><p>Amber marks the group being varied. In 43, it marks the position where NH₂ was removed.</p></header><div class="vertex-ring-card-grid">'+first+'</div><p class="vertex-tree-table-note">NIH-3T3 F508del-CFTR potentiation assay. EC₅₀ values are in µM, mean ± SD from at least three determinations. For 37, 39 and 41, the percentages are responses at 30 µM relative to VRT-532—not EC₅₀ values. Compound 45: 0.003 µM = 3 nM.</p></section><div class="vertex-phenol-stage-divider" aria-hidden="true"></div><div class="vertex-indole-intro"><figure><h3>Compound 45</h3><img src="assets/vertex-phenol-edit-45.svg" width="420" height="245" alt="Phenol 45 with its OH group highlighted in amber."><figcaption class="vertex-phenol-caption">Keep the phenol; explore another ring position.</figcaption></figure><section><h3>Can we vary substituent size and lipophilicity while retaining potency?</h3><p>Phenol 45 supplied a potent new starting point. The authors varied the 2-position of the aniline-derived ring, para to its OH group.</p><ul><li><strong>Keep:</strong> the phenol OH, existing tert-butyl group and quinolinone–amide portion.</li><li><strong>Vary:</strong> add F, CF₃ or tert-butyl to make 46–48.</li><li><strong>Measure:</strong> check whether CFTR potency survives these changes.</li></ul><p class="vertex-indole-result"><strong>What happened:</strong> all four compounds measured approximately 2–3 nM. Potency alone did not distinguish 48 as the development candidate.</p></section></div><section class="vertex-ring-gallery"><header><h3>2 · Substitute the phenol series: 45 → 46–48</h3><p>Amber highlights the group added relative to 45. Activity values below are in nM.</p></header><div class="vertex-ring-card-grid">'+second+'</div><p class="vertex-tree-table-note">Same NIH-3T3 F508del-CFTR assay; EC₅₀ mean ± SD from at least three determinations. Selected indoles and phenols are brought together in the later profile comparison.</p></section><p class="vertex-map-citation"><a href="https://doi.org/10.1021/jm5012808" target="_blank" rel="noopener noreferrer">Hadida et al. · Tables 6–8, text pp. 9779–9780 ↗</a></p></article>';
}
function vertexBranchesMeet(){
 const decisions=hitProgram().stages.flatMap(stage=>stage.decisions||[]),comparison=decisions.find(d=>d.id==='compare');
 const sourceLink=(label)=>'<a href="https://doi.org/10.1021/jm5012808" target="_blank" rel="noopener noreferrer">Hadida et al. · '+label+' ↗</a>';
 const tableRows=comparison.table.rows.map(row=>{
  const num=Number.parseInt(row[0],10),m=comparison.molecules.find(m=>m.number===num),indices=[1,2,5,6,7,3,4];
  return '<tr'+(num===48?' class="vertex-meet-selected"':'')+'><th scope="row"><strong>'+num+'</strong><span>'+ (num<40?'Indole':'Phenol')+(num===48?' · selected':'')+'</span><a href="'+escapeHtml(m.src)+'" target="_blank" rel="noopener noreferrer" aria-label="Enlarge compound '+num+'"><img src="'+escapeHtml(m.src)+'" width="460" height="260" alt="Structure of compound '+num+'"></a></th>'+indices.map(i=>'<td'+(num===45&&i===2?' class="vertex-meet-potency"':num===48&&(i===5||i===6)?' class="vertex-meet-pk"':'')+'>'+escapeHtml(row[i])+'</td>').join('')+'</tr>';
 }).join('');
 return '<article class="vertex-meeting"><header class="vertex-meeting-header"><h3>Which compound has the profile to become a development candidate?</h3><p>Bring the selected indoles and phenols together. Compare activity with disposition to prioritize a candidate for further profiling.</p></header><div class="vertex-meet-branches" aria-label="The two chemistry routes converge"><span><strong>Indole route</strong> 28 · 30</span><span aria-hidden="true">↘ &nbsp; ↙</span><span><strong>Phenol route</strong> 45 · 46 · 47 · 48</span></div><section class="vertex-meet-comparison"><h3>Compare the measured profiles</h3><div class="vertex-meet-annotated"><aside class="vertex-meet-side vertex-meet-side-left" aria-label="Activity interpretation"><article class="vertex-meet-margin-note is-potency"><h4>45 wins on potency</h4><p>HBE EC₅₀: <strong>5 nM</strong> for 45 versus <strong>22 nM</strong> for 48.</p><p>That advantage must be weighed against 45’s higher clearance and shorter half-life.</p></article></aside><div class="vertex-meet-table-scroll" role="region" tabindex="0" aria-label="Activity and rat intravenous pharmacokinetics for six candidates"><table class="vertex-meet-table"><caption>Selected analogs · activity from Tables 5 and 8; human-cell activity and rat IV PK from Table 9</caption><thead><tr class="vertex-meet-groups"><th rowspan="2" scope="col">Compound</th><th colspan="2" scope="colgroup">Functional activity</th><th colspan="5" scope="colgroup">Rat intravenous pharmacokinetics</th></tr><tr><th scope="col">Optical EC₅₀<small>nM</small></th><th scope="col">HBE EC₅₀<small>nM</small></th><th scope="col">Clearance<small>mL/min/kg</small></th><th scope="col">Half-life<small>h</small></th><th scope="col">Vss<small>L/kg</small></th><th scope="col">IV dose<small>mg/kg</small></th><th scope="col">AUC₀–∞<small>µg·h/mL</small></th></tr></thead><tbody>'+tableRows+'</tbody></table></div><aside class="vertex-meet-side vertex-meet-side-right" aria-label="PK interpretation"><article class="vertex-meet-margin-note"><h4>Read AUC with the dose</h4><p>IV doses differ, so raw AUC is not a same-dose ranking.</p></article><article class="vertex-meet-margin-note is-pk"><h4>48 wins on this PK profile</h4><p>47 and 48 share a mean HBE EC₅₀ of <strong>22 nM</strong>.</p><p>48 has lower clearance and a longer half-life. Together with its activity, this supports prioritizing 48 for further profiling.</p></article></aside></div><div class="vertex-meet-table-key"><span><i class="is-potency" aria-hidden="true"></i>45: strongest HBE potency</span><span><i class="is-pk" aria-hidden="true"></i>48: lowest clearance and longest half-life</span></div><p class="vertex-tree-table-note">Vss is apparent steady-state distribution volume, not a score to maximize. Optical and HBE assays use different biological systems; these cellular and rat PK data are not a paired in vivo PK/PD study.</p><details class="vertex-profile-notes"><summary>Assay definitions and source</summary><p>Optical: NIH-3T3 cells expressing F508del-CFTR. HBE: human bronchial epithelial cells with F508del-CFTR. EC₅₀ values include the reported SD where available; Table 9 lists 42 nM for 28 without an SD. Optical values for 28 and 30 are converted from µM to nM. This is selected profiling, not a matched ADME or toxicity panel for all compounds.</p><p>'+sourceLink('Tables 5, 8–9')+'</p></details></section></article>';
}
function vertexLeadToDC(){
 const exposure=hitProgram().stages.flatMap(stage=>stage.decisions||[]).find(d=>d.id==='exposure');
 const followup=hitProgram().decisionMap.nodes.find(n=>n.id==='confirm');
 const sourceLink=(label)=>'<a href="https://doi.org/10.1021/jm5012808" target="_blank" rel="noopener noreferrer">Hadida et al. · '+label+' ↗</a>';
 const liabilities={...followup.comparison,title:'Check 48 against the starting lead',caption:'Lead 16 and the additional characterization of 48',columns:['Question','Lead 16','Compound 48 · follow-up','What this supports'],rows:[['CFTR potency','Optical EC₅₀ 100 ± 60 nM','Optical EC₅₀ 3 ± 1 nM','Greater potency in the original functional assay.'],...followup.comparison.rows]};
 return '<article class="vertex-lead-dc"><header class="vertex-meeting-header"><h3>From a promising lead to a development candidate</h3><p>Compare the structures and the reported evidence: what improved, and what still needs attention?</p></header><div class="vertex-lead-dc-structures"><figure><figcaption><strong>Compound 16</strong><span>Starting lead</span></figcaption><img src="assets/vertex-lead-dc-16.svg" width="420" height="245" alt="Chemical structure of lead compound 16"></figure><span class="vertex-lead-dc-arrow" aria-hidden="true">→</span><figure class="is-dc"><figcaption><strong>Compound 48 · VX-770</strong><span>Development candidate · ivacaftor</span></figcaption><img src="assets/vertex-lead-dc-48.svg" width="420" height="245" alt="Chemical structure of development candidate 48, ivacaftor"></figure></div><section class="vertex-meet-followup"><header><h3>Did 48 address the liabilities of lead 16?</h3><p>The starting lead and compound 48’s additional characterization, as reported in the paper.</p></header>'+vertexTreeComparison(liabilities)+'<p class="vertex-tree-table-note">Values come from the separate studies reported in the paper. The selectivity panels and GABAₐ readouts differ; the single-concentration percentage for 48 does not provide an IC₅₀ fold improvement.</p><p class="vertex-map-citation">'+sourceLink('Tables 2–3, 8, 10; profiling discussion and footnotes 17–18')+'</p><details class="vertex-profile-notes"><summary>Additional species, pharmacology and reporting notes</summary>'+vertexTreeComparison(exposure.table)+'<ul><li><strong>Oral dose range:</strong> AUC and Cmax reportedly increased linearly across 1–200 mg/kg in rats and 3–80 mg/kg in dogs; dose-specific values are not tabulated.</li><li><strong>Additional human-cell pharmacology:</strong> in G551D/F508del HBE, 48 had an EC₅₀ of 0.236 ± 0.200 µM and maximal chloride secretion near 50% of non-CF HBE. These are cellular results.</li><li><strong>CYP panel:</strong> 1A2, 2C9, 2C19, 2E1, 3A4 and 2D6; inhibition IC₅₀ values were above 20 µM.</li><li><strong>Human clearance:</strong> 4.7 mL/min/kg was an allometric prediction from four species, not a measured human result.</li><li><strong>Solubility:</strong> the authors report improved organic solubility, with poor aqueous solubility remaining. Footnote 23, cited for 48, names compound 38; its numerical values are not reassigned to 48 here.</li></ul><p>'+sourceLink('Table 10, text pp. 9780–9781 and footnote 23')+'</p></details></section><section class="vertex-dc-nomination vertex-dc-nomination-text"><div><span>THE DEVELOPMENT DECISION</span><h3>Nominate compound 48 · VX-770 / ivacaftor</h3><p>Potency, relevant human-cell activity, selectivity and a favorable PK profile supported the authors’ selection of 48 for further preclinical and clinical evaluation.</p><p><strong>Carry forward:</strong> poor aqueous solubility and formulation needs. The early screens do not constitute a complete safety or IND-enabling package.</p></div></section><p class="vertex-ring-chronology">This reconstructs the decision from published evidence. The article does not supply formal internal nomination thresholds or the exact order of every experiment; later clinical success is not used to justify the earlier choice.</p><p class="vertex-map-citation">'+sourceLink('selection rationale, p. 9780; conclusion, p. 9781')+'</p></article>';
}
function selectVertexExampleTab(id){

function vertexProgramTree(){
 const map=hitProgram().decisionMap,selected=map.nodes.find(n=>n.id===state.vertexMapNode)||map.nodes[0];
 const b=(id,title,subtitle,extra)=>vertexTreeNode(id,title,subtitle,selected.id,extra);
 const fork='<svg class="vertex-tree-fork" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true"><path d="M500 0V18H250V40 M500 18H750V40"/></svg>';
 const join='<svg class="vertex-tree-join" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true"><path d="M250 0V18H500V40 M750 0V18H500"/></svg>';
 const tree='<div class="vertex-tree-scroll" role="region" tabindex="0" aria-label="Vertex lead optimization decision tree"><div class="vertex-tree">'+
 '<div class="vertex-tree-root is-wide">'+b('rings','Start with 16–22 · compare the ring edits','16 remains the indole lead; active indoline 17 opens a second route. 18–22 lose activity.')+'</div>'+
 '<div class="vertex-tree-context"><span>Additional evidence guiding the split</span><div>'+b('baseline','Broader profile of 16','Solubility, selectivity and exposure liabilities.','is-rule')+b('core','Retain the amide core','23–26 lose activity after linker changes.','is-rule')+'</div></div>'+
 '<p class="vertex-tree-fork-question">Two chemical hypotheses for improving the same lead</p>'+fork+
 '<div class="vertex-tree-lanes"><section class="vertex-tree-lane"><div class="vertex-tree-hypothesis"><h3>A · Grow the active indole</h3><p>Retain the indole of 16. Explore alkyl size and position at sites 3 and 5 to improve activity and the overall profile.</p></div>'+b('branches','16 → indoles 27–30','28 and 30 receive deeper profiling.')+'<p class="vertex-tree-side-note">27 adds no optical potency gain. 29 is potent; its absence from the later PK table is unexplained.</p><div class="vertex-tree-through"><span>28 and 30 remain in the comparison</span></div></section>'+
 '<section class="vertex-tree-lane"><div class="vertex-tree-hypothesis"><h3>B · Open the ring and rebuild</h3><p>Indoline 17 retained activity. Ring opening offered an alternative aniline framework with different substitution options.</p></div>'+b('ringopen','17 → 31–36 · recover activity','Opening the ring weakens activity; alkyl substitution recovers it in 36.')+'<div class="vertex-tree-stem" aria-hidden="true"></div>'+b('phenol','36 → phenol 45 → 46–48','Phenol 45 gains potency; further analogs test the broader profile.')+'<p class="vertex-tree-side-note">Several 37–44 replacements lose activity. Potency gains leave selectivity and exposure questions open.</p></section></div>'+join+
 '<div class="vertex-tree-root is-wide">'+b('compare','Both branches meet · 28, 30, 45, 46, 47, 48','Compare human airway-cell activity with rat clearance and half-life. 48 has the best rat IV profile in this selected set.')+'</div><div class="vertex-tree-stem" aria-hidden="true"></div>'+
 '<div class="vertex-tree-root is-wide">'+b('confirm','48 · test oral use and remaining liabilities','Oral exposure, multi-species PK and broader selectivity support advancement. Aqueous solubility remains poor.')+'</div><div class="vertex-tree-stem" aria-hidden="true"></div>'+
 '<div class="vertex-tree-root">'+b('advance','Advance 48 for further evaluation →','Open questions and the next evidence package.','is-terminal is-outcome')+'</div></div></div>';
 return '<section class="vertex-program-tree"><p class="vertex-tree-intro">'+escapeHtml(map.intro)+'</p>'+tree+'<p class="vertex-map-provenance">'+escapeHtml(map.note)+'</p><section id="hit-example-panel" aria-live="polite">'+vertexProgramMapDetail(selected)+'</section></section>';
}
function vertexTreeComparison(t,molecules=[]){
 const lookup=new Map(molecules.map(m=>[m.number,m.src]));
 const html=t.rows.map((row,i)=>'<tr'+(t.highlightRows?.includes(i)?' class="evidence-selected"':'')+'>'+row.map((value,j)=>{
  if(j)return '<td>'+escapeHtml(value)+'</td>';
  const n=Number(String(value).match(/^\d+\b/)?.[0]);
  const src=lookup.get(n)||(t.structures&&(n>=16&&n<=48)?'assets/vertex-lead-compound-'+n+'.svg':null);
  return '<th scope="row">'+escapeHtml(value)+(src?'<a href="'+escapeHtml(src)+'" target="_blank" rel="noopener noreferrer" aria-label="Enlarge compound '+n+'"><img src="'+escapeHtml(src)+'" width="460" height="260" alt="Structure of compound '+n+'"></a>':'')+'</th>';
 }).join('')+'</tr>').join('');
 return '<div class="vertex-tree-table-scroll" role="region" tabindex="0" aria-label="'+escapeHtml(t.title)+'"><table class="vertex-tree-table'+(t.structures||molecules.length?' has-structures':'')+'"><caption>'+escapeHtml(t.caption)+'</caption><thead><tr>'+t.columns.map(c=>'<th scope="col">'+escapeHtml(c)+'</th>').join('')+'</tr></thead><tbody>'+html+'</tbody></table></div>';
}

function selectVertexMapNode(id){
 if(state.screen!=='lesson'||state.lesson!=='discovery-optimization'||state.step!==1)return;
 const selected=hitProgram().decisionMap?.nodes.find(n=>n.id===id);if(!selected)return;
 state.vertexMapNode=id;

let applyingRoute=false;
function navigateHash(hash,replace=false){if(applyingRoute||location.hash===hash)return;history[replace?'replaceState':'pushState'](null,'',hash);}
function applyRoute(){
 applyingRoute=true;
 try{
  const parts=location.hash.slice(1).split('/');
  if(!parts[0]||parts[0]==='portal')showPortal();
  else if(['overview','small-molecule'].includes(parts[0])&&!parts[1])showOverview();
  else {const id=parts[0]==='small-molecule'?parts[1]:parts[0],raw=parts[0]==='small-molecule'?parts[2]:parts[1],step=raw===undefined?undefined:Number(raw);if(allIds.includes(id)&& (step===undefined||(Number.isInteger(step)&&step>=0&&step<=2)))startLevel(id,step);else showPortal();}
 }finally{applyingRoute=false;}
}
window.addEventListener('hashchange',applyRoute);

']);setExposure(input.bioavailability,input.halfLife);return startLevel('exposure',1);}}];for(const t of definitions)try{await context.registerTool({...t,annotations:{readOnlyHint:false,untrustedContentHint:false,...t.annotations}},{signal:lifecycle.signal});}catch{console.warn('Optional learning tool unavailable.');}}
